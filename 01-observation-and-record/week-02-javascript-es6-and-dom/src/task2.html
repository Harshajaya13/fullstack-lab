<!DOCTYPE html>
<html>
<head>
  <title>Todo List</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 40px; display: flex; justify-content: center; }
    .box { background: #1e293b; border: 1px solid #334155; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 360px; }
    h2 { margin: 0 0 15px; color: #38bdf8; text-align: center; font-size: 22px; }
    .row { display: flex; gap: 8px; margin-bottom: 15px; }
    input { flex: 1; padding: 10px 12px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; outline: none; font-size: 14px; }
    input:focus { border-color: #38bdf8; }
    button { background: #2563eb; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    button:hover { background: #1d4ed8; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { background: #0f172a; border: 1px solid #334155; padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .done { text-decoration: line-through; color: #64748b; }
    .del { background: #ef4444; padding: 4px 10px; font-size: 12px; border-radius: 6px; }
    .del:hover { background: #dc2626; }
  </style>
</head>
<body>
  <div class="box">
    <h2>📋 Todo List</h2>
    <div class="row">
      <input type="text" id="task" placeholder="Add new task...">
      <button onclick="add()">Add</button>
    </div>
    <ul id="list"></ul>
  </div>

  <script>
    function add() {
      let inp = document.getElementById('task');
      if (!inp.value.trim()) return;
      let li = document.createElement('li');
      li.innerHTML = `<span onclick="this.classList.toggle('done')" style="cursor:pointer">${inp.value}</span> <button class="del" onclick="this.parentElement.remove()">✕</button>`;
      document.getElementById('list').appendChild(li);
      inp.value = '';
    }
  </script>
</body>
</html>
