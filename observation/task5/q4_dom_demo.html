<!DOCTYPE html>
<html>
<head><title>DOM Demo</title></head>
<body>
    <h2>DOM Manipulation Demo</h2>
    <h3 id="heading">Original Heading</h3>
    <img id="img" src="https://via.placeholder.com/100" alt="Old Image"><br><br>

    <button onclick="changeContent()">Change Content</button>
    <button onclick="changeStyle()">Change Style</button>
    <button onclick="changeAttr()">Change Attribute</button>

    <script>
        const h = document.getElementById('heading');
        const img = document.getElementById('img');

        function changeContent() { h.textContent = "New Heading Text!"; }
        function changeStyle() { h.style.color = "red"; }
        function changeAttr() { img.setAttribute('alt', 'New Image Description'); }
    </script>
</body>
</html>
