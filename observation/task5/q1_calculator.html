<!DOCTYPE html>
<html>
<head><title>Product Calculator</title></head>
<body>
    <h2>Product Calculator</h2>
    Product: <input type="text" id="name"><br><br>
    Quantity: <input type="number" id="qty" value="1"><br><br>
    Price: <input type="number" id="price" value="0"><br><br>
    <h3>Total: ₹<span id="total">0</span></h3>

    <script>
        const qty = document.getElementById('qty');
        const price = document.getElementById('price');
        const total = document.getElementById('total');

        function calculate() {
            total.textContent = (parseFloat(qty.value) || 0) * (parseFloat(price.value) || 0);
        }

        qty.addEventListener('input', calculate);
        price.addEventListener('input', calculate);
    </script>
</body>
</html>
