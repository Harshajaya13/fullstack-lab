<!DOCTYPE html>
<html>
<head><title>Functions vs Classes</title></head>
<body>
    <h2>JS Functions vs Classes</h2>
    <button onclick="runDemo()">Create Objects</button>
    <div id="output"></div>

    <script>
        // Class blueprint to create multiple objects
        class Student {
            constructor(name, roll) {
                this.name = name;
                this.roll = roll;
            }
            getDetails() {
                return `Student: ${this.name}, Roll: ${this.roll}`;
            }
        }

        function runDemo() {
            const s1 = new Student("Rahul", 101);
            const s2 = new Student("Priya", 102);
            document.getElementById('output').innerHTML = `${s1.getDetails()}<br>${s2.getDetails()}`;
        }
    </script>
</body>
</html>
