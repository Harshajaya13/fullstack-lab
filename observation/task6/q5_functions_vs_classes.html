<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q5 - Functions vs Classes</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .info { background: #f0f8ff; padding: 10px; border-left: 4px solid #008080; }
        .output { margin-top: 10px; padding: 8px; border: 1px solid #aaa; font-family: monospace; }
    </style>
</head>
<body>

    <h2>JavaScript Functions vs Classes</h2>
    <div class="info">
        <p><strong>Functions:</strong> Executable code blocks called to perform calculations.</p>
        <p><strong>Classes:</strong> ES6 blueprints used with <code>new</code> keyword to create multiple unique objects sharing common properties and methods.</p>
    </div>

    <h3>Class Instantiation Demo</h3>
    <button onclick="instantiateObjects()">Create Objects</button>

    <div id="display" class="output">Click button to instantiate objects...</div>

    <script>
        // Class Blueprint defining common properties and methods
        class Student {
            constructor(name, rollNo) {
                this.name = name;
                this.rollNo = rollNo;
            }

            // Common Method for all instances
            getDetails() {
                return `Student Name: ${this.name} | Roll No: ${this.rollNo}`;
            }
        }

        // Function creating multiple instances using 'new'
        function instantiateObjects() {
            const s1 = new Student("Rahul Sharma", 101);
            const s2 = new Student("Priya Patel", 102);

            document.getElementById('display').innerHTML = 
                `${s1.getDetails()}<br>${s2.getDetails()}`;
        }
    </script>

</body>
</html>
